<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />

    <meta name="description" content="Mochi - Sistem Rekomendasi Diet Personal Berbasis Web untuk Nutrisi Optimal Ibu Hamil. Dapatkan menu harian yang dirancang khusus untuk Anda." />
    <meta name="theme-color" content="#FBF7F0" />

      rel="stylesheet"
    />
    <script>
      try {
        var mochiRedirect = sessionStorage.getItem('mochi_spa_redirect');
        if (mochiRedirect) {
          sessionStorage.removeItem('mochi_spa_redirect');
          history.replaceState(null, '', mochiRedirect);
        }
      } catch (e) {
        /* abaikan — tanpa redirect tersimpan, lanjut normal */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
